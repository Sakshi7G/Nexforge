version: '3.8'

services:
  nexforge-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - JWT_SECRET=nexforge_production_secret_key_change_me
      - DATABASE_URL=file:./dev.db
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    volumes:
      # Mount host Docker socket so backend can spawn per-workspace sandbox containers
      - /var/run/docker.sock:/var/run/docker.sock
      - nexforge_workspaces:/app/workspaces_storage
    restart: unless-stopped

volumes:
  nexforge_workspaces:
